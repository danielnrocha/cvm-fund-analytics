version: 2
models:
- name: entities
  description: Fixed eligible CVM reporting-class cohort; one row per class identifier and CNPJ.
  columns:
  - name: cnpj
    data_tests:
    - unique
    - not_null
  - name: entity_id
    data_tests:
    - unique
    - not_null
- name: report_calendar
  description: Expected reporting days in the frozen cohort; this is not every calendar date.
  columns:
  - name: report_date
    data_tests:
    - unique
    - not_null
- name: captures
  description: Capture identity and observation timestamp, distinct from the business reporting date.
  columns:
  - name: capture_id
    data_tests:
    - unique
    - not_null
  - name: captured_at
    data_tests:
    - unique
    - not_null
- name: int_resolved
  description: Resolve normalized source identity to exactly one class; ambiguity cannot multiply observations.
  columns:
  - name: identity_status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - resolved
- name: int_daily
  description: One class/day/capture group; identical duplicates retain provenance and conflicting values fail quality tests.
  columns:
  - name: conflict
    data_tests:
    - accepted_values:
        arguments:
          values:
          - false
          quote: false
- name: sat_daily_report
  description: Append-only capture versions. Replay is idempotent; late corrections preserve earlier captured values.
  columns:
  - name: version_id
    data_tests:
    - unique
    - not_null
- name: bronze_classified
  description: Parse derived JSON envelopes and classify accepted, rejected and excluded source rows without losing original payload provenance.
- name: stg_observations
  description: Typed accepted daily observations; JSON transport does not imply the CVM original file was JSON.
- name: current_daily
  description: Latest captured observation per reporting class and business date; earlier versions remain in the satellite.
- name: quarantine
  description: Rejected raw envelopes with reasons; rejection is observable and blocks publication under the current policy.
- name: audit_ingestion_files
  description: Reconcile source rows into accepted, rejected and excluded counts for each frozen file.
