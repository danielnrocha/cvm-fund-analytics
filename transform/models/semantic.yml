version: 2
models:
  - name: fct_daily
    description: >-
      One row per eligible reporting class and expected reporting day in the frozen
      April-September 2026 cohort. Missing reports retain null amounts; zero means
      an observed zero. This is a cohort, not the whole Brazilian fund market.
    semantic_model:
      enabled: true
    agg_time_dimension: report_date
    columns:
      - name: observation_id
        description: Unique class/day key, including expected days with no submitted observation.
        data_type: varchar
        data_tests: [unique, not_null]
        entity: {name: observation, type: primary}
      - name: entity_id
        description: Reporting class identifier. Do not add parent funds or subclasses to this population.
        data_type: varchar
        data_tests: [not_null]
        entity: {name: reporting_entity, type: foreign}
      - name: classification_at_capture
        description: Classification observed at capture time, not a historical effective-dated classification.
        data_type: varchar
        dimension: {type: categorical}
      - name: report_date
        description: Business reporting date, distinct from the capture or ingestion timestamp.
        data_type: date
        dimension: {type: time}
        granularity: day
      - name: pl
        description: Reported net assets in nominal BRL. Null means missing; additive across eligible classes, not time.
        data_type: decimal(17,2)
      - name: net_flow
        description: Subscriptions minus redemptions in nominal BRL. Additive across classes and reporting days.
        data_type: decimal(38,2)
      - name: reported
        description: One for an observed class/day; zero for an expected but missing report.
        data_type: integer
      - name: expected
        description: One for each class/day in the fixed cohort and reporting calendar.
        data_type: integer
    metrics:
      - name: reported_net_assets_eop
        description: Reported PL at the latest common reporting date in each query time bucket. Missing classes remain missing; inspect closing coverage.
        type: simple
        agg: sum
        expr: pl
        non_additive_dimension: {name: report_date, window_agg: max, group_by: []}
      - name: net_flow
        description: Net subscriptions minus redemptions over the requested interval; missing observations are not inferred.
        type: simple
        agg: sum
        expr: net_flow
      - name: reporting_observations
        description: Number of observed class/day reports within the requested interval.
        type: simple
        agg: sum
        expr: reported
      - name: expected_observations
        description: Number of expected class/day reports in the frozen cohort and reporting calendar.
        type: simple
        agg: sum
        expr: expected
      - name: reporting_entities_eop
        description: Number of classes reporting on the common closing date.
        type: simple
        agg: sum
        expr: reported
        non_additive_dimension: {name: report_date, window_agg: max, group_by: []}
      - name: expected_entities_eop
        description: Number of eligible classes expected on the common closing date.
        type: simple
        agg: sum
        expr: expected
        non_additive_dimension: {name: report_date, window_agg: max, group_by: []}
  - name: time_spine
    description: Daily time spine for MetricFlow; eligibility is governed separately by report_calendar.
    time_spine: {standard_granularity_column: date_day}
    columns:
      - name: date_day
        granularity: day
metrics:
  - name: reporting_coverage_period
    description: Observed reports divided by expected reports over the interval; ratio of totals, never average subgroup percentages.
    type: ratio
    numerator: reporting_observations
    denominator: expected_observations
  - name: reporting_coverage_eop
    description: Reporting classes divided by expected classes at the common closing date.
    type: ratio
    numerator: reporting_entities_eop
    denominator: expected_entities_eop
