version: 2
unit_tests:
  - name: resolve_mask_and_reject_fund_namespace
    model: int_resolved
    given:
      - input: ref('stg_observations')
        rows:
          - {source_id: a, kind: 'CLASSES - FIF', cnpj: '00.000.000/0001-00', subclass: null}
          - {source_id: b, kind: FI, cnpj: '00000000000100', subclass: null}
          - {source_id: c, kind: 'CLASSES - FIF', cnpj: 'garbage00000000000100', subclass: null}
          - {source_id: d, kind: 'CLASSES - FIF', cnpj: '00000000000100', subclass: X}
      - input: ref('entities')
        rows:
          - {cnpj: '00000000000100', entity_id: 'CVM:CLASS:A'}
    expect:
      rows:
        - {source_id: a, entity_id: 'CVM:CLASS:A', identity_status: resolved}
        - {source_id: b, entity_id: null, identity_status: unsupported_level}
        - {source_id: c, entity_id: null, identity_status: invalid_cnpj}
        - {source_id: d, entity_id: null, identity_status: unsupported_level}
  - name: ambiguous_registry_never_multiplies_observation
    model: int_resolved
    given:
      - input: ref('stg_observations')
        rows:
          - {source_id: a, kind: 'CLASSES - FIF', cnpj: '00000000000100'}
          - {source_id: b, kind: 'CLASSES - FIF', cnpj: '00000000000200'}
      - input: ref('entities')
        rows:
          - {cnpj: '00000000000100', entity_id: A}
          - {cnpj: '00000000000100', entity_id: B}
    expect:
      rows:
        - {source_id: a, entity_id: null, identity_status: ambiguous}
        - {source_id: b, entity_id: null, identity_status: unknown}
  - name: identical_duplicates_preserve_provenance
    model: int_daily
    given:
      - input: ref('int_resolved')
        rows:
          - {capture_id: v1, source_id: s1, entity_id: A, report_date: '2026-04-01', pl: 100, subscriptions: 10, redemptions: 0, identity_status: resolved}
          - {capture_id: v1, source_id: s2, entity_id: A, report_date: '2026-04-01', pl: 100, subscriptions: 10, redemptions: 0, identity_status: resolved}
    expect:
      rows:
        - {capture_id: v1, entity_id: A, pl: 100, source_count: 2, source_ids: 's1|s2', conflict: false}
  - name: equal_pl_different_flow_is_conflict
    model: int_daily
    given:
      - input: ref('int_resolved')
        rows:
          - {capture_id: v1, source_id: s1, entity_id: A, report_date: '2026-04-01', pl: 100, subscriptions: 10, identity_status: resolved}
          - {capture_id: v1, source_id: s2, entity_id: A, report_date: '2026-04-01', pl: 100, subscriptions: 11, identity_status: resolved}
    expect:
      rows:
        - {capture_id: v1, entity_id: A, source_count: 2, conflict: true}
  - name: captures_a_b_a_remain_distinct
    model: int_daily
    given:
      - input: ref('int_resolved')
        rows:
          - {capture_id: v1, source_id: s1, entity_id: A, report_date: '2026-04-01', pl: 100, identity_status: resolved}
          - {capture_id: v2, source_id: s2, entity_id: A, report_date: '2026-04-01', pl: 105, identity_status: resolved}
          - {capture_id: v3, source_id: s3, entity_id: A, report_date: '2026-04-01', pl: 100, identity_status: resolved}
    expect:
      rows:
        - {capture_id: v1, pl: 100}
        - {capture_id: v2, pl: 105}
        - {capture_id: v3, pl: 100}
  - name: dense_calendar_keeps_missing_distinct_from_zero
    model: fct_daily
    given:
      - input: ref('current_daily')
        rows:
          - {entity_id: A, report_date: '2026-04-01', pl: 100, subscriptions: 10, redemptions: 0}
          - {entity_id: B, report_date: '2026-04-01', pl: 200, subscriptions: 20, redemptions: 0}
          - {entity_id: A, report_date: '2026-04-02', pl: 110, subscriptions: 0, redemptions: 0}
      - input: ref('entities')
        rows: [{entity_id: A}, {entity_id: B}]
      - input: ref('report_calendar')
        rows: [{report_date: '2026-04-01'}, {report_date: '2026-04-02'}, {report_date: '2026-04-03'}]
    expect:
      rows:
        - {entity_id: A, report_date: '2026-04-01', pl: 100, net_flow: 10, reported: 1, expected: 1}
        - {entity_id: B, report_date: '2026-04-01', pl: 200, net_flow: 20, reported: 1, expected: 1}
        - {entity_id: A, report_date: '2026-04-02', pl: 110, net_flow: 0, reported: 1, expected: 1}
        - {entity_id: B, report_date: '2026-04-02', pl: null, net_flow: null, reported: 0, expected: 1}
        - {entity_id: A, report_date: '2026-04-03', pl: null, net_flow: null, reported: 0, expected: 1}
        - {entity_id: B, report_date: '2026-04-03', pl: null, net_flow: null, reported: 0, expected: 1}
  - name: latest_capture_uses_observation_time_not_id_sort
    model: current_daily
    given:
      - input: ref('sat_daily_report')
        rows:
          - {capture_id: z, captured_at: '2026-10-01 12:00:00', entity_id: A, report_date: '2026-04-01', pl: 100}
          - {capture_id: a, captured_at: '2026-10-02 12:00:00', entity_id: A, report_date: '2026-04-01', pl: 105}
    expect:
      rows:
        - {capture_id: a, pl: 105}
  - name: derived_flow_widens_before_subtracting_source_amounts
    model: fct_daily
    given:
      - input: ref('current_daily')
        rows:
          - {entity_id: A, report_date: '2026-04-01', pl: 100, subscriptions: '999999999999999.99', redemptions: '-999999999999999.99'}
      - input: ref('entities')
        rows: [{entity_id: A}]
      - input: ref('report_calendar')
        rows: [{report_date: '2026-04-01'}]
    expect:
      rows:
        - {entity_id: A, net_flow: '1999999999999999.98', reported: 1, expected: 1}
  - name: empty_population_returns_no_facts
    model: fct_daily
    given:
      - input: ref('current_daily')
        rows: []
      - input: ref('entities')
        rows: []
      - input: ref('report_calendar')
        rows: [{report_date: '2026-04-01'}]
    expect:
      rows: []
